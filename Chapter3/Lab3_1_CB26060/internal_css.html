<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning CSS</title>
  <style>
    /* General paragraph styling */
    p { color: #333333; }
    .highlight { background-color: #fff3cd; }
    #notice { color: darkred; }

    /* centres the main heading and sets its color to navy */
    h1{text-align: center; color: navy; }
  </style>
</head>
<body>
  <h1>Learning CSS</h1>

  <!-- h2 and first paragraph are same background color using same class-->
  <h2 class="highlight">Practice makes progress</h2> 
  <p class="highlight">CSS controls the presentation of a web page.</p>

  <p id="notice">I can change the appearance without changing the content.</p>

  <!-- paragraph 3 has no id or class -->
  <p>CSS is a powerful tool for web design.</p>
</body>
</html>
